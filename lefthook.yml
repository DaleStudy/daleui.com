# Lefthook 설정 — https://lefthook.dev
#
# pre-commit: staged 파일만 자동 수정(eslint --fix → prettier --write) 후 재-stage.
#             둘 다 같은 파일을 수정하므로 순차 실행(키 알파벳순: eslint → prettier).
# pre-push:   test·typecheck 검증. 둘 다 소스를 수정하지 않아 병렬(parallel) 안전.
#             `bun run build`는 prebuild가 tracked 파일(showcase.generated.json 등)을
#             네트워크에 의존해 재생성하므로 훅에서 제외

pre-commit:
  commands:
    eslint:
      glob: "*.{ts,tsx}"
      run: bunx eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{ts,tsx,js,jsx,cjs,mjs,mts,css,json,jsonc,md,mdx,yml,yaml,html}"
      run: bunx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    test:
      run: bunx vitest run
    typecheck:
      run: bunx tsc -b
